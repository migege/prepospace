services:
  prepospace:
    build: .
    image: prepospace:local
    container_name: prepospace
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
